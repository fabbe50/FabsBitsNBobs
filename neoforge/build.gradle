plugins {
    id 'com.github.johnrengelman.shadow'
}

def generatedResources = project(":common").file("src/main/generated/resources")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        data {
            clientData()
            programArgs("--all", "--mod", "${mod_id}")
            programArgs("--output", generatedResources.absolutePath)
            programArgs("--existing", project(":common").file("src/main/resources").absolutePath)
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    //modRuntimeOnly "dev.emi:emi-neoforge:${emi_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:$rei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:$rei_version"

    modCompileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
//    modRuntimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    modApi "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    var replaceProperties = [
            version : project.version,
            loader_version_range: rootProject.neoforge_loader_version_range
    ]
    inputs.properties replaceProperties

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
